name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (if needed)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Derive bundle version
        id: ver
        # Bundles are named with the bare version (SiteCollector_0.4.0_...),
        # while the git tag carries a leading "v" (v0.4.0). Strip it so the
        # release notes always name files that actually exist.
        #
        # shell: bash is required. The runner is windows-latest, whose default
        # shell is PowerShell, where ${GITHUB_REF_NAME#v} parses as a variable
        # literally named "GITHUB_REF_NAME#v" -- always empty. That silently
        # published "SiteCollector__x64-setup.exe" with the version missing.
        shell: bash
        run: |
          num="${GITHUB_REF_NAME#v}"
          if [ -z "$num" ]; then
            echo "::error::could not derive version from GITHUB_REF_NAME='$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## SiteCollector ${{ github.ref_name }}

            本地优先的网站收藏桌面应用（Tauri 2 + Vue 3 + Rust）。

            ### 亮点
            - 全量统一到 Naive UI 2.45.3：颜色由 `palettes.ts` / `tokens.ts` 单一来源驱动，设置页与关于页重排，分类树加入层级引导线
            - `Ctrl+K` 命令面板：添加站点、导入导出、检测全部、切换视图、设置、失效清理；支持输入法组合态让位
            - 站点图标（favicon）自动抓取与本地缓存，列表直接显示

            ### 新增功能
            - 重复链接管理：统一 URL 归一化、分组、保留/合并/标记，导入摘要含重复数
            - 检查策略：按全部/分类/标签/所选范围检测，失败重试次数与并发上限可配置
            - 批量整理：失效站点清理（二次确认 + 回收站兜底）、批量改分类/标签
            - 搜索增强：关键词 + 分类 + 标签 + 状态 + 时间组合筛选，可保存常用筛选
            - 备份体验：本地备份列表、手动备份、一键恢复（恢复前自动快照）

            ### 修复与改进
            - 检测重试语义与设置一致：主流程改用单次探测原语，避免内置重试叠加放大网络请求
            - 备份序号冲突、删除后残留选择、恢复后视图/检测状态清理等边界问题已修复
            - favicon 缓存路径 confinement、下载体积上限、HTML 实体解码与保存竞态加固

            ### 安装
            - `SiteCollector_${{ steps.ver.outputs.num }}_x64-setup.exe`：NSIS 安装包
            - `SiteCollector_${{ steps.ver.outputs.num }}_x64_en-US.msi`：MSI 安装包

            > 本版本由 GitHub Actions 自动构建并生成，支持应用内检查更新。
          # Publish immediately, not as a draft. A draft release has no
          # public download URL, so the updater endpoint
          # (releases/latest/download/latest.json) 404s and in-app update
          # checks fail until someone publishes it by hand.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

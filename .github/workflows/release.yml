name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (if needed)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## SiteCollector v0.2.0

            本地优先的网站收藏桌面应用（Tauri 2 + Vue 3 + Rust）。

            ### 新功能
            - 多选拖拽：选中多个站点后拖拽其中一个，全部移动到目标分类
            - 浏览器书签导入/导出：支持 Netscape HTML 格式，与 Chrome/Firefox/Edge 互通
            - URL 自动获取标题：输入链接后自动抓取网页标题填入名称（支持手动重试）
            - 并发检测：5 个站点同时检测，速度提升约 5 倍
            - 编辑时 URL 去重：防止编辑后与其他站点链接冲突
            - 排序扩展：新增按分类名、备注、检测时间排序（中文拼音排序）
            - 筛选结果计数：状态栏显示"共 X 个 · 当前 Y 个"
            - 空状态引导：空列表/空回收站/无筛选结果时显示友好图标和提示
            - 备注字数放宽：50 字 → 200 字，带字数统计

            ### Bug 修复
            - checkOne 离线预检：右键单个检测时若网络断开则中止，不误标失效
            - 原子写入：数据文件写入使用 tmp+rename，防止崩溃时损坏 JSON
            - 版本号对齐：统一 package.json / Cargo.toml / tauri.conf.json 版本为 0.2.0

            ### 其他
            - 安装目录改为英文 `C:\Program Files\SiteCollector`
            - 新增 Playwright E2E 测试（30 个端到端测试场景）
            - 新增 StatusBar / RecycleView / AddEditModal 组件测试

            ### 安装
            - `SiteCollector_0.2.0_x64-setup.exe`：NSIS 安装包
            - `SiteCollector_0.2.0_x64_en-US.msi`：MSI 安装包

            > 本版本由 GitHub Actions 自动构建并生成。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

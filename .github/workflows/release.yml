name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (if needed)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## SiteCollector v0.2.1

            本地优先的网站收藏桌面应用（Tauri 2 + Vue 3 + Rust）。

            ### 新功能
            - 对话框布局优化：字段分两栏排列（名称+链接 | 分类+标签），备注移至底部全宽显示（200 字）
            - 多套配色方案：11 套高级感配色色板（青绿/海洋/靛青/紫罗兰/玫瑰/琥珀/翡翠/石墨/砂岩/天空/梅紫），亮/暗模式独立，设置中一键切换
            - 配色持久化：所选配色跨重启保持，存储在 settings.json

            ### 改进
            - 备注区域从 52px 增至 80px，支持完整显示多行内容
            - 编辑对话框移除冗余的右侧帮助栏，空间利用更合理
            - 启动时通过 localStorage 预加载主题配色，避免页面闪烁

            ### 安装
            - `SiteCollector_0.2.1_x64-setup.exe`：NSIS 安装包
            - `SiteCollector_0.2.1_x64_en-US.msi`：MSI 安装包

            > 本版本由 GitHub Actions 自动构建并生成。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (if needed)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Derive bundle version
        id: ver
        # Bundles are named with the bare version (SiteCollector_0.3.2_...),
        # while the git tag carries a leading "v" (v0.3.2). Strip it so the
        # release notes always name files that actually exist.
        run: echo "num=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## SiteCollector ${{ github.ref_name }}

            本地优先的网站收藏桌面应用（Tauri 2 + Vue 3 + Rust）。

            ### 修复
            - 标签管理界面：全选后取消勾选某个标签，该标签会从列表中消失且无法保存。
              原因是 `useSelection` 的 `selectAll()` 直接把数据数组本体赋给选中态，
              之后 `toggle()` 的 `splice()` 便作用在数据源上。已改为复制数组
            - 该问题影响所有共用 `useSelection` 且传入数据本体的调用方，
              现补充 4 个单元测试覆盖「取消勾选不得改动数据源」

            ### 改进
            - Release 改为构建完成即发布，不再是草稿。
              草稿没有公开下载地址，会让 `releases/latest/download/latest.json`
              返回 404，导致应用内「检查更新」始终失败
            - 发布说明的文件名改由标签名推导，避免再次出现说明与实际产物不符
            - `playwright-report/` 与 `test-results/` 加入 `.gitignore`

            ### 安装
            - `SiteCollector_${{ steps.ver.outputs.num }}_x64-setup.exe`：NSIS 安装包
            - `SiteCollector_${{ steps.ver.outputs.num }}_x64_en-US.msi`：MSI 安装包

            > 本版本由 GitHub Actions 自动构建并生成，支持应用内检查更新。
          # Publish immediately, not as a draft. A draft release has no
          # public download URL, so the updater endpoint
          # (releases/latest/download/latest.json) 404s and in-app update
          # checks fail until someone publishes it by hand.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

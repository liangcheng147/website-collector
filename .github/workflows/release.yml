name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (if needed)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## 归集 v0.1.4

            本地优先的网站收藏桌面应用（Tauri 2 + Vue 3 + Rust）。

            ### 本版本更新
            - 全新青绿色高级感主题（浅色 / 深色），替代原靛蓝配色
            - 站点列表、管理页、侧栏等界面重新打磨，修复悬停列宽重排 / 管理页间距 / 标签下拉错位
            - 可复用标签选择器（chip + 补全 + 新建 + 去重）
            - 列表键盘流（上下移动 / 全选 / 删除 / 打开）
            - 表头点击排序、回收站二次确认等体验优化
            - 弹窗定位居中（Teleport 到 body），导入/管理改为分段开关样式
            - 修复暗色模式下分段开关、按钮、复选框的文字对比度

            ### 安装
            - `归集_0.1.4_x64-setup.exe`：NSIS 安装包
            - `归集_0.1.4_x64_zh-CN.msi`：MSI 安装包

            > 本版本由 GitHub Actions 自动构建并生成。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

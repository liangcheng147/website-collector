name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (if needed)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## SiteCollector ${{ github.ref_name }}

            本地优先的网站收藏桌面应用（Tauri 2 + Vue 3 + Rust）。

            ### 界面
            - 组件风格统一：按钮/输入框统一为 36px 高、8px 圆角，标签统一为胶囊形，弹窗内边距统一为 20px
            - 设置弹窗重构为「左侧导航 + 右侧内容」的固定高度布局，不再因内容多少跳变
            - 新增开关 (Toggle) 组件替换设置页原生复选框，支持键盘操作与无障碍标签
            - 主题、配色、设置等页面观感一致，焦点态统一

            ### 改进
            - 修复图标统一后失效的端到端测试选择器（11 个用例恢复）
            - 设置按钮补充 aria-label，修复图标按钮无可访问名称的问题
            - 端到端测试纳入 CI（push/PR 到 master 时运行），此类问题今后在提交时即被发现
            - 修复存在工作树时 `npm test` 会误收集工作树内测试文件的问题
            - 版本号四处（tauri.conf/Cargo.toml/Cargo.lock/package.json）同步至 0.3.1

            ### 安装
            - `SiteCollector_0.3.1_x64-setup.exe`：NSIS 安装包
            - `SiteCollector_0.3.1_x64_en-US.msi`：MSI 安装包

            > 本版本由 GitHub Actions 自动构建并生成，支持应用内检查更新。
          # Publish immediately, not as a draft. A draft release has no
          # public download URL, so the updater endpoint
          # (releases/latest/download/latest.json) 404s and in-app update
          # checks fail until someone publishes it by hand.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

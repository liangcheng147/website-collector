name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (if needed)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Derive bundle version
        id: ver
        # Bundles are named with the bare version (SiteCollector_0.3.2_...),
        # while the git tag carries a leading "v" (v0.3.2). Strip it so the
        # release notes always name files that actually exist.
        #
        # shell: bash is required. The runner is windows-latest, whose default
        # shell is PowerShell, where ${GITHUB_REF_NAME#v} parses as a variable
        # literally named "GITHUB_REF_NAME#v" -- always empty. That silently
        # published "SiteCollector__x64-setup.exe" with the version missing.
        shell: bash
        run: |
          num="${GITHUB_REF_NAME#v}"
          if [ -z "$num" ]; then
            echo "::error::could not derive version from GITHUB_REF_NAME='$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## SiteCollector ${{ github.ref_name }}

            本地优先的网站收藏桌面应用（Tauri 2 + Vue 3 + Rust）。

            ### 修复
            - **应用内更新下载失败**（v0.3.2 及更早版本受影响）：
              点「检查更新」能查到新版本，但点下载必定报错
              `TypeError: Cannot read private member from an object whose class did not declare it`
            - 原因：Tauri v2 的 `Update` 继承自 `Resource`，其资源 id 存放在真正的
              私有字段中，读取时会对 `this` 做品牌检查。而更新对象被存进 Vue 的
              `ref()`，被深度响应式 Proxy 包裹，读取私有字段时品牌检查失败
            - 改用 `shallowRef` 保存更新对象，并移除掩盖该类型不匹配的强制断言
            - 回归测试继承真实的 `Resource` 类，验证深代理会抛错而 `shallowRef` 不会

            ### 改进
            - 发布工作流的版本号推导显式使用 bash。运行在 windows-latest，
              默认 shell 是 PowerShell，`${GITHUB_REF_NAME#v}` 会被解析为
              一个不存在的变量而得到空串，导致发布说明里的文件名缺少版本号。
              现已指定 `shell: bash`，并在推导结果为空时直接失败

            ### 包含
            - 同时包含 v0.3.2 的标签管理修复（全选后取消勾选会导致标签消失且无法保存）

            ### 安装
            - `SiteCollector_${{ steps.ver.outputs.num }}_x64-setup.exe`：NSIS 安装包
            - `SiteCollector_${{ steps.ver.outputs.num }}_x64_en-US.msi`：MSI 安装包

            > 本版本由 GitHub Actions 自动构建并生成，支持应用内检查更新。
          # Publish immediately, not as a draft. A draft release has no
          # public download URL, so the updater endpoint
          # (releases/latest/download/latest.json) 404s and in-app update
          # checks fail until someone publishes it by hand.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
